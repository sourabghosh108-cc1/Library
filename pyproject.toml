[project]
name = "cyan-communications"
version = "1.0.0"
description = "Xm Mail + Xm Network on Django"
requires-python = ">=3.9"
dependencies = [
  "asgiref==3.6.0",
  "Django==4.1.5",
  "sqlparse==0.4.3",
  "tzdata==2022.7",
  "whitenoise==6.6.0",
  "psycopg2-binary==2.9.9",
]

[tool.vercel]
entrypoint = "cyancom.wsgi:application"

[tool.vercel.scripts]
build = "python build.py"
